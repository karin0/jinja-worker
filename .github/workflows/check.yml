name: check
on:
  push:
    paths-ignore:
      - README.md
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal -c clippy,rustfmt -t wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo clippy --target wasm32-unknown-unknown
      - run: cargo test

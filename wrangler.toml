name = "jinja-worker"
main = "build/worker/shim.mjs"
compatibility_date = "2024-10-07"
# A route given on the command line would otherwise turn the workers.dev URL off.
workers_dev = true

[build]
# worker-build 0.9 refuses the worker crate 0.8, so the build installs the worker-build release that
# matches the worker in Cargo.lock.
command = "cargo install -q worker-build@^$(cargo pkgid worker | cut -d@ -f2) && worker-build --release"

[observability]
enabled = true
